name: Tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONUTF8: '1'
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install Pillow==11.3.0
      - name: Anime Studio
        run: |
          python packaging/version.py
          python -u packaging/run_tests.py
          node --test tests/test_*.cjs
          python tests/test_pipeline.py
      - name: Manga Studio
        run: |
          python -m unittest discover -s manga -p 'test_*.py' -v
          node --test manga/test_*.cjs
